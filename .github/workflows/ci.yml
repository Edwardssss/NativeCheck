name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runtime dependencies are what users install, so a known advisory in one of
  # them is a release blocker. Checked once instead of per Node version, and
  # without installing: `npm audit` only needs the lockfile.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # `npm run audit` pins the registry on purpose: the audit endpoint exists
      # on registry.npmjs.org, and mirrors do not implement it.
      - run: npm run audit

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Same suite as `npm test`, plus the coverage floors in vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run rules:coverage:strict
      - run: npm run format:check
      - run: npm run build
