name: ground-truth

# Ground Truth Docker matrix: real npm installs plus a compiler-wrapper
# wrapper, producing L1/L2/L3 accuracy numbers to catch rule decay.
#
# Two cadences, because they answer different questions:
#   - weekly (plus manual): the full glibc + musl matrix on an ubuntu runner;
#     alpine (musl) and darwin/win32 are covered locally / on dedicated runners.
#   - on pull requests that can move accuracy: one glibc cell, so a rule change is
#     measured before it merges rather than the following Monday.
#
# The gate lives in collect.py's exit code (--gate): FN 0%, FP 5%, and a minimum
# number of samples so a run that measured nothing cannot pass.
#
# Run the main CI once before this to ensure the code is testable.
on:
  workflow_dispatch: # manual: repo Actions → Run workflow
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC
  pull_request:
    paths:
      - 'src/**'
      - 'fixtures/**'
      - 'testdata/ground-truth/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ground-truth.yml'

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # glibc (bookworm) + musl (alpine) cells for each major Node on linux-x64
        cell:
          - { node: '20', libc: glibc }
          - { node: '22', libc: glibc }
          - { node: '24', libc: glibc }
          - { node: '20', libc: musl }
          - { node: '22', libc: musl }
          - { node: '24', libc: musl }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build # produce dist/cli.js for predict.sh to run --deep inside containers

      # 1) Run the real install measurement + L2 prediction for the target cell
      #    (same container, env-accurate). run-matrix.sh calls probe-install.sh per
      #    fixture (the compiler wrapper decides `compiled`) and predict.sh
      #    (nativecheck --deep → out/<cell>/<fixture>.prediction.json).
      #    The L2 prediction shares the cell env with the measurement
      #    (node/libc/toolchain) — otherwise the four-square table is meaningless.
      #    Never predict from the host.
      - name: Run matrix cell ${{ matrix.cell.node }}-${{ matrix.cell.libc }}
        env:
          NC_NODE_MAJORS: ${{ matrix.cell.node }}
          NC_LIBMODES: ${{ matrix.cell.libc }}
        run: bash testdata/ground-truth/run-matrix.sh

      # 2) Aggregate the four-square table and enforce the thresholds: FN 0%
      #    and FP <= 5%, with a floor on the sample count. The exit code is the
      #    contract — nothing scrapes the printed table for a rate any more.
      #    (collect.py auto-reads prediction.json inside each cell; no --predict.)
      - name: Collect L2 table and enforce the accuracy gate
        run: python3 testdata/ground-truth/collect.py testdata/ground-truth/out --blockers --gate

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ground-truth-${{ matrix.cell.node }}-${{ matrix.cell.libc }}
          path: testdata/ground-truth/out/

  # One cell on pull requests that can move accuracy (see the `paths` filter
  # above). The classifier is the same code in every cell, so a single glibc
  # cell on linux-x64 — the cell a runner can produce natively — is enough to
  # notice decay before merge; the weekly matrix keeps the other five honest.
  #
  # Dependabot is skipped: a version bump touches package.json and the lockfile,
  # which are in the paths filter, but it cannot move the classifier — and if a
  # dependency did change ingest behaviour, the fixture expectations fail in
  # seconds instead of after a Docker matrix.
  pr-cell:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build # dist/cli.js is what predict.sh runs inside the container

      - name: Measure and predict one glibc cell (Node 22)
        env:
          NC_NODE_MAJORS: '22'
          NC_LIBMODES: glibc
        run: bash testdata/ground-truth/run-matrix.sh

      - name: Collect L2 table and enforce the accuracy gate
        run: python3 testdata/ground-truth/collect.py testdata/ground-truth/out --blockers --gate

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ground-truth-pr-cell
          path: testdata/ground-truth/out/
