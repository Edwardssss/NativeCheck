name: publish

# Release pipeline: publish to npm with provenance attestation (SLSA L3).
#
# Trigger: push a tag `v*` (e.g. `v1.0.0`). The tag must match package.json's
# version — the job asserts this before publishing to prevent a version skew.
#
# Authentication is npm **trusted publishing** (OIDC), so this repository stores
# no publishing token: `id-token: write` lets npm mint a short-lived credential
# and the provenance attestation from the workflow identity. One-time setup on
# npmjs.com: the `nativecheck` package → Settings → Trusted Publisher → GitHub
# Actions, with this repository and the workflow filename `publish.yml`.
#
# Trusted publishing needs npm >= 11.5.1, which is why the job builds on a Node
# line that ships it (see the setup-node step). If a token is ever needed again,
# `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` on the publish step is the fallback.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for trusted publishing and `npm publish --provenance`

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only allow tags on the default branch / real repo (skip forks by default;
    # set ALLOW_FORK_PUBLISH=1 to enable).
    if: github.repository_owner == 'Edwardssss' || github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.x: trusted publishing needs >= 11.5.1.
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} != package.json version ${pkg}"
            exit 1
          fi

      - run: npm ci

      # Full quality gates before any publish (the same contract as CI).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run rules:coverage:strict
      - run: npm run format:check
      # A release is the last moment an advisory can still be cheap to act on.
      - run: npm run audit
      - run: npm run build

      # No token: npm authenticates through the workflow's OIDC identity.
      - run: npm publish --provenance --access public
