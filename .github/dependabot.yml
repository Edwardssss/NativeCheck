version: 2

updates:
  # Runtime dependencies are what users install, so patch updates are worth
  # taking early; majors arrive individually because @npmcli/arborist is npm's
  # own library and its majors are not a public API contract.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      runtime-patches:
        dependency-type: production
        update-types: ['patch']
      # Majors still arrive — those are the updates that change behaviour — but as
      # one PR per ecosystem instead of one per dependency, so reviewing them is a
      # decision rather than a queue. They are never auto-merged.
      majors:
        patterns: ['*']
        update-types: ['major']

  # The workflows pin actions by major tag; this keeps those tags moving. All of
  # them land in one PR: an action bump is not a behaviour change to review one by
  # one.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
