# Held-out: deasync (Pattern D — source-only via bindings).
#
# deasync depends on `bindings` (+ node-addon-api), which hits the LEGACY_NATIVE_DEPS
# signal → SourceOnly. strategy is SOURCE_BUILD; risk is NOT pinned here (it
# depends on the local toolchain, per the fixtures/ Pattern D convention).
#
# Note (2026-09-05): deasync installs with `node ./build.js`, which first looks for the
# `bin/{plat}-{arch}-node-{v}/deasync.node` prebuilt binary bundled in its own tarball and
# skips the build when it is there (bundled-prebuilt-first, see known-blindspots §1.5). L1 only
# sees bindings + node-addon-api + hasInstallScript in the lockfile and cannot read the script
# body, so SourceOnly is the correct L1 output. It also means deasync's "really compiled or
# not" cannot be told apart at L1 — which is a limit of the signal, not of the classifier.
strategy: SOURCE_BUILD
native: true
network_calls: 0
subject: deasync
notes: >
  Pattern D guard on the `bindings` branch (LEGACY_NATIVE_DEPS). deasync has
  node-addon-api too, but `bindings` is checked first and both map to SourceOnly.
