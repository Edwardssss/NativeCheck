# Held-out: heapdump (Pattern D — source-only via nan).
#
# heapdump compiles a V8 heap-snapshot addon with nan + `node-gyp rebuild`.
# `nan` hits the LEGACY_NATIVE_DEPS signal → SourceOnly. strategy SOURCE_BUILD,
# risk unpinned (toolchain-dependent).
pattern: SourceOnly
strategy: SOURCE_BUILD
native: true
network_calls: 0
subject: heapdump
notes: >
  Pattern D guard on the pure-`nan` branch. No downloader, no prebuild loader —
  the only signal is nan + install script.
