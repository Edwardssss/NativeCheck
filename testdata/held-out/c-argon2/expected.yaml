# Held-out: argon2 (Pattern C — node-pre-gyp with @mapbox/node-pre-gyp).
#
# Critical generalization check: argon2 depends on BOTH @mapbox/node-pre-gyp
# (Pattern C signal) AND node-addon-api (Pattern B heuristic). Without the
# C-before-B detection ordering (a lesson from the benchmark set), argon2
# would be misclassified as Prebuildify. The held-out set catches ordering
# regressions.
#
# Risk stays UNVERIFIED on the fast path: probing the downloader's remote host
# would leave zero-network. --deep resolves it to LOW or HIGH.
pattern: RemoteDownload
strategy: PREBUILT
risk: UNVERIFIED
native: true
network_calls: 0
subject: argon2
notes: >
  C-before-B ordering is the regression guard. Risk-UNVERIFIED is the
  fast-path compromise; --deep is the only place where risk can resolve
  for a C-mode package.
