# Held-out: argon2 (Pattern C — node-pre-gyp with @mapbox/node-pre-gyp).
#
# Critical generalization check: argon2 depends on BOTH @mapbox/node-pre-gyp
# (Pattern C signal) AND node-addon-api (Pattern B heuristic). Without the
# C-before-B detection ordering (lesson from benchmark G, see CHANGELOG
# 订正 11), argon2 would be misclassified as Prebuildify. Held-out set
# catches ordering regressions.
#
# Risk is UNVERIFIED in fast path because we can't HEAD-probe the downloader's
# remote host without leaving zero-network. --deep would resolve to LOW or HIGH.
pattern: RemoteDownload
strategy: PREBUILT
risk: UNVERIFIED
native: true
network_calls: 0
subject: argon2
notes: >
  C-before-B ordering is the regression guard. Risk-UNVERIFIED is the
  fast-path compromise; --deep is the only place where risk can resolve
  for a C-mode package.
