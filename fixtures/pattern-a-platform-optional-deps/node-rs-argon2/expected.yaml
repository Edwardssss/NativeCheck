# Pattern A — @node-rs/argon2 style: a cluster of platform sub-packages such as @node-rs/argon2-linux-x64-gnu.
# Same mechanism as esbuild / swc (a JS main package plus N optional native sub-packages): no compile, no risk.
# Adds a non-bundler sample to pattern A (a cryptography library), guarding against overfitting to esbuild / swc.
# Lockfile generated by `npm install --package-lock-only @node-rs/argon2@2.0.2`.
