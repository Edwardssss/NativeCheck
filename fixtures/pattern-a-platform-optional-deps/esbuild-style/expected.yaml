# Pattern A — esbuild style (a main package plus N optional @esbuild/<platform> sub-packages).
# It has an install script (a picker) yet carries no risk: a false-positive guard.
# package-lock.json generated by `npm install --package-lock-only esbuild@0.25.0`;
# arborist's loadVirtual reads it directly, with no node_modules needed.
pattern: PlatformOptionalDeps
strategy: PREBUILT
risk: LOW
native: true # key: a pure-JS detector misses it (esbuild itself is JS; the native part is in the sub-package)
network_calls: 0 # key: asserts zero network, which stops regressions
subject: esbuild
