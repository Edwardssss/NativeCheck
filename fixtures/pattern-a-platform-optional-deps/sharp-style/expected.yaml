# Pattern A — sharp style (no install script; the @img/sharp-* platform sub-packages do the work), a false-negative guard.
# Lockfile generated by `npm install --package-lock-only sharp@0.34.0`.
pattern: PlatformOptionalDeps
strategy: PREBUILT
risk: LOW
native: true # key: a pure-JS detector misses sharp (it has no install script)
network_calls: 0 # key: asserts zero network, so the default path cannot quietly go online
subject: sharp
