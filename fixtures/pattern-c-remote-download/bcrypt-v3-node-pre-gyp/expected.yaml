# Pattern C — the legacy-ABI node-pre-gyp variant: bcrypt@3 depends on node-pre-gyp + nan.
# Same downloader family as bcrypt@5 (C), but its napi artifacts only cover older Node ABIs,
# so on a modern Node (22 / 24) the derived URL 404s → --deep turns it into SOURCE_BUILD + HIGH.
# Under fast mode nothing is verified → still honestly UNVERIFIED (never guessed as HIGH or LOW).
# Key regression: classify must recognise plain node-pre-gyp (no @mapbox prefix) as C, and
# fast mode must not pre-empt the risk. Lockfile generated by `npm install --package-lock-only bcrypt@3.0.8`.
pattern: RemoteDownload
strategy: PREBUILT
risk: UNVERIFIED
native: true
network_calls: 0
subject: bcrypt
