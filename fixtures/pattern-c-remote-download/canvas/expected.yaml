# Pattern C — remote download: canvas depends on node-addon-api + prebuild-install (C).
# prebuild-install fetches a prebuilt binary from GitHub Releases rather than shipping it in the tarball.
# Under fast mode the remote artifact is unverified → UNVERIFIED (--deep sends the HEAD: a hit → LOW).
# Note the two findings: canvas (native, C) plus prebuild-install (a tool, NotNative);
# subject pins the assertion to the native entry point, canvas.
# Lockfile generated by `npm install --package-lock-only canvas@3.2.3`.
pattern: RemoteDownload
strategy: PREBUILT
risk: UNVERIFIED
native: true
network_calls: 0
subject: canvas
