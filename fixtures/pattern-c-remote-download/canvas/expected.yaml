# 模式 C —— remote-download：canvas 依赖 node-addon-api + prebuild-install（C）。
# prebuild-install 从 GitHub Releases 拉预编译二进制（而非打进自身 tarball）。
# fast 下远端产物未验证 → UNVERIFIED（--deep 发 HEAD，命中→LOW）。
# 注意含 2 个 finding：canvas(native,C) + prebuild-install(工具,NotNative)；
# 用 subject 只断言 native 入口 canvas。
# 真实 lockfile 由 `npm install --package-lock-only canvas@3.2.3` 生成。
pattern: RemoteDownload
strategy: PREBUILT
risk: UNVERIFIED
native: true
network_calls: 0
subject: canvas
