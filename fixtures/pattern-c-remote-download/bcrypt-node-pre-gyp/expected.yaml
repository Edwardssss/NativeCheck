# Pattern C — the node-pre-gyp variant (not prebuild-install!): bcrypt@5 depends on
# @mapbox/node-pre-gyp + node-addon-api and pulls from binary.host (GitHub Releases).
# {module_name}-v{version}-node-v{abi}-{platform}-{arch}.tar.gz。
# Under fast mode the remote artifact is unverified → UNVERIFIED (--deep sends the HEAD: a hit → LOW).
# Key regression: classify must recognise @mapbox/node-pre-gyp as remote download (C),
# otherwise the node-addon-api heuristic would misread it as prebuildify (B).
# Lockfile generated by `npm install --package-lock-only bcrypt@5.1.1`.
pattern: RemoteDownload
strategy: PREBUILT
risk: UNVERIFIED
native: true
network_calls: 0
subject: bcrypt
