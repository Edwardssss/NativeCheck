# Non-native control with an install script: core-js is pure JS, but it ships a postinstall
# script (ads / telemetry, not native). The point: an install script does not mean native.
# Correct behaviour is SUSPICIOUS (grey), pattern=NotNative, risk=AMBIGUOUS — never YES/native,
# and never dropping the suspicious install-script signal just because no native trait exists.
# Contrast with pure-js-lodash (no install script → native:false, no candidates): this sample
# has a candidate, but that candidate is not native. Lockfile generated by `npm install --package-lock-only core-js@3.40.0`.
pattern: NotNative
strategy: UNKNOWN
risk: AMBIGUOUS
native: true # there is a candidate (SUSPICIOUS) but it is not native — guards against both a missed install script and a false native verdict
native_count: 1
network_calls: 0
subject: core-js
