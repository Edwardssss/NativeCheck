# 模式 D —— source-only：node-pty@1.1.0 用 node-addon-api + install 脚本
# （node scripts/prebuild.js || node-gyp rebuild）→ 源码编译，无预编译产物。
# 关键回归：node-addon-api + install 脚本 必须判 SourceOnly（D），
# 不能落入「node-addon-api → Prebuildify」的过宽启发式（对照 better-sqlite3@13 无 install 脚本 → B）。
# strategy 恒为 SOURCE_BUILD（环境无关）。risk 依赖本机工具链 → 不 pin（环境相关）。
# 真实 lockfile 由 `npm install --package-lock-only node-pty@1.0.0`（解析为 1.1.0）生成。
pattern: SourceOnly
strategy: SOURCE_BUILD
native: true
network_calls: 0
subject: node-pty
