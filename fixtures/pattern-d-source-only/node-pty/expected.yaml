# Pattern D — source-only: node-pty@1.1.0 uses node-addon-api plus an install script
# (node scripts/prebuild.js || node-gyp rebuild) → a source build, with no prebuilt artifacts.
# Key regression: node-addon-api with an install script must classify as SourceOnly (D) and must
# not fall into the too-broad "node-addon-api → Prebuildify" heuristic (contrast better-sqlite3@13,
# which has no install script → B). strategy is always SOURCE_BUILD; risk is not pinned.
# Lockfile generated by `npm install --package-lock-only node-pty@1.0.0` (which resolves to 1.1.0).
pattern: SourceOnly
strategy: SOURCE_BUILD
native: true
network_calls: 0
subject: node-pty
