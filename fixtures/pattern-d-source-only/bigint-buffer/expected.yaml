# Pattern D — source-only: bigint-buffer builds with bindings + node-gyp rebuild (N-API) and has
# no node-gyp-build / prebuild-install, so it always compiles. Its install script degrades
# gracefully (`|| echo`: a failed build falls back to the pure-JS implementation), which does
# not change the source-only classification. strategy is always SOURCE_BUILD; risk is not pinned.
pattern: SourceOnly
strategy: SOURCE_BUILD
native: true
network_calls: 0
subject: bigint-buffer
